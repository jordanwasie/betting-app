<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArenaBets | Premium Sportsbook, Keno & Aviator</title>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #151c2c;
      --bg-hover: #1e293b;
      --accent: #3b82f6;
      --accent-green: #22c55e;
      --accent-yellow: #eab308;
      --accent-red: #ef4444;
      --text-white: #f8fafc;
      --text-dim: #94a3b8;
      --border: #26334d;
    }
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    body { 
      background-color: var(--bg-main); 
      color: var(--text-white); 
      display: flex; 
      flex-direction: column; 
      min-height: 100vh; 
    }
    header { 
      background: #070a12; 
      padding: 12px 24px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid var(--border); 
      position: sticky; 
      top: 0; 
      z-index: 100; 
    }
    .logo { 
      font-size: 20px; 
      font-weight: 800; 
      color: var(--accent); 
      display: flex; 
      align-items: center; 
      gap: 8px; 
    }
    .nav-tabs { 
      display: flex; 
      gap: 8px; 
      background: #0f172a; 
      padding: 4px; 
      border-radius: 8px; 
      border: 1px solid var(--border); 
    }
    .nav-btn { 
      background: none; 
      border: none; 
      color: var(--text-dim); 
      padding: 8px 16px; 
      border-radius: 6px; 
      font-weight: 600; 
      cursor: pointer; 
      transition: all 0.2s; 
    }
    .nav-btn.active, .nav-btn:hover { 
      background: var(--accent); 
      color: white; 
    }
    .wallet-box { 
      background: var(--bg-card); 
      padding: 8px 16px; 
      border-radius: 20px; 
      border: 1px solid var(--accent-green); 
      color: var(--accent-green); 
      font-weight: 700; 
    }
    .app-container { 
      display: flex; 
      flex: 1; 
      padding: 20px; 
      gap: 20px; 
      max-width: 1400px; 
      margin: 0 auto; 
      width: 100%; 
    }
    .main-viewport { flex: 1; }
    .sidebar { 
      width: 320px; 
      background: var(--bg-card); 
      border-radius: 12px; 
      padding: 16px; 
      border: 1px solid var(--border); 
      height: fit-content; 
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .section-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 16px; 
    }
    .section-title { 
      font-size: 18px; 
      font-weight: 700; 
      color: var(--text-white); 
    }
    /* Sports Cards */
    .match-card { 
      background: var(--bg-card); 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      padding: 16px; 
      margin-bottom: 12px; 
    }
    .match-meta { 
      display: flex; 
      justify-content: space-between; 
      font-size: 12px; 
      color: var(--accent-yellow); 
      margin-bottom: 8px; 
      font-weight: 600; 
    }
    .match-teams { 
      font-size: 16px; 
      font-weight: 700; 
      margin-bottom: 14px; 
      display: flex; 
      justify-content: space-between; 
    }
    .odds-row { 
      display: grid; 
      grid-template-columns: repeat(8, 1fr); 
      gap: 6px; 
    }
    .odd-box { 
      background: var(--bg-main); 
      border: 1px solid var(--border); 
      padding: 8px 4px; 
      border-radius: 6px; 
      text-align: center; 
      cursor: pointer; 
      transition: 0.2s; 
    }
    .odd-box:hover, .odd-box.selected { 
      border-color: var(--accent); 
      background: var(--accent); 
    }
    .odd-label { 
      font-size: 10px; 
      color: var(--text-dim); 
      display: block; 
    }
    .odd-val { 
      font-size: 12px; 
      font-weight: 700; 
      color: var(--accent-green); 
      margin-top: 2px; 
    }
    .odd-box:hover .odd-label, .odd-box:hover .odd-val { color: white; }
    
    /* Keno Grid */
    .keno-wrapper { 
      background: var(--bg-card); 
      border: 1px solid var(--border); 
      padding: 20px; 
      border-radius: 12px; 
    }
    .keno-grid { 
      display: grid; 
      grid-template-columns: repeat(10, 1fr); 
      gap: 8px; 
      margin: 16px 0; 
    }
    .keno-btn { 
      background: var(--bg-main); 
      border: 1px solid var(--border); 
      color: white; 
      padding: 12px 0; 
      text-align: center; 
      border-radius: 6px; 
      font-weight: 700; 
      cursor: pointer; 
    }
    .keno-btn.selected { 
      background: var(--accent-yellow); 
      color: black; 
      border-color: var(--accent-yellow); 
    }
    .keno-btn.drawn { 
      background: var(--accent-red); 
      color: white; 
    }

    /* Aviator Arena */
    .aviator-wrapper { 
      background: #000; 
      border: 2px solid var(--accent-red); 
      border-radius: 12px; 
      height: 350px; 
      position: relative; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
    }
    .aviator-multiplier { 
      font-size: 54px; 
      font-weight: 900; 
      color: var(--accent-red); 
      z-index: 10; 
      text-shadow: 0 0 20px rgba(239, 68, 68, 0.5); 
    }
    .aviator-controls { 
      margin-top: 16px; 
      display: flex; 
      gap: 12px; 
    }

    /* Bet Slip */
    .slip-title { 
      font-size: 16px; 
      font-weight: 700; 
      border-bottom: 1px solid var(--border); 
      padding-bottom: 10px; 
      margin-bottom: 12px; 
    }
    .slip-list { min-height: 120px; }
    .slip-item { 
      background: var(--bg-main); 
      border: 1px solid var(--border); 
      padding: 10px; 
      border-radius: 6px; 
      margin-bottom: 8px; 
      position: relative; 
    }
    .slip-item-title { font-size: 12px; font-weight: 700; }
    .slip-item-pick { font-size: 11px; color: var(--accent-green); margin-top: 4px; }
    .slip-item-remove { 
      position: absolute; 
      right: 8px; 
      top: 8px; 
      color: var(--accent-red); 
      cursor: pointer; 
      font-weight: bold; 
    }
    .stake-input { 
      width: 100%; 
      background: var(--bg-main); 
      border: 1px solid var(--border); 
      padding: 10px; 
      color: white; 
      border-radius: 6px; 
      margin: 12px 0; 
      font-weight: 700; 
    }
    .btn-place { 
      width: 100%; 
      background: var(--accent-green); 
      border: none; 
      padding: 14px; 
      border-radius: 8px; 
      color: white; 
      font-weight: 800; 
      font-size: 14px; 
      cursor: pointer; 
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">ArenaBets Pro</div>
    <div class="nav-tabs">
      <button class="nav-btn active" onclick="switchTab(event, 'sports')">Sportsbook</button>
      <button class="nav-btn" onclick="switchTab(event, 'keno')">Keno 80</button>
      <button class="nav-btn" onclick="switchTab(event, 'aviator')">Aviator</button>
    </div>
    <div class="wallet-box" id="user-balance">1,000.00 ETB</div>
  </header>

  <div class="app-container">
    <div class="main-viewport">
      <!-- SPORTSBOOK PANEL -->
      <div id="sports" class="tab-panel active">
        <div class="section-header">
          <div class="section-title">Live & Upcoming Matches</div>
          <button onclick="loadSportsData()" style="background:var(--bg-card); border:1px solid var(--border); color:white; padding:6px 12px; border-radius:6px; cursor:pointer;">Refresh Odds</button>
        </div>
        <div id="sports-container"></div>
      </div>

      <!-- KENO PANEL -->
      <div id="keno" class="tab-panel">
        <div class="keno-wrapper">
          <div class="section-title">Keno 80 Draw</div>
          <p style="color:var(--text-dim); font-size:12px; margin-top:4px;">Pick up to 10 numbers to play</p>
          <div class="keno-grid" id="keno-grid"></div>
          <button onclick="startKenoDraw()" class="btn-place" style="background:var(--accent-yellow); color:black;">PLAY KENO ROUND</button>
        </div>
      </div>

      <!-- AVIATOR PANEL -->
      <div id="aviator" class="tab-panel">
        <div class="aviator-wrapper">
          <div class="aviator-multiplier" id="flight-mult">1.00x</div>
          <p id="flight-status" style="color:var(--text-dim); font-size:12px; z-index:10; margin-top:8px;">Plane preparing for takeoff...</p>
        </div>
        <div class="aviator-controls">
          <button onclick="cashoutAviator()" class="btn-place" style="background:var(--accent-red);">CASHOUT BET</button>
        </div>
      </div>
    </div>

    <!-- SIDEBAR BET SLIP -->
    <div class="sidebar">
      <div class="slip-title">Bet Slip</div>
      <div class="slip-list" id="slip-list">
        <p style="color:var(--text-dim); font-size:12px;">No selections added yet.</p>
      </div>
      <input type="number" class="stake-input" id="stake-amount" value="100" placeholder="Stake Amount (ETB)" oninput="updatePayout()">
      <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:12px; color:var(--text-dim);">
        <span>Est. Payout:</span>
        <span style="color:var(--accent-green); font-weight:bold;" id="est-payout">0.00 ETB</span>
      </div>
      <button class="btn-place" onclick="placeBet()">PLACE BET NOW</button>
    </div>
  </div>

  <script>
    let selectedPicks = [];

    function switchTab(evt, tab) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      evt.currentTarget.classList.add('active');
    }

    async function loadSportsData() {
      const container = document.getElementById('sports-container');
      container.innerHTML = "<p style='color:var(--text-dim)'>Fetching live odds...</p>";
      try {
        const res = await fetch('/api/matches');
        const matches = await res.json();
        container.innerHTML = matches.map(m => {
          const matchTitle = (m.home + " vs " + m.away).replace(/'/g, "\\'");
          return `
            <div class="match-card">
              <div class="match-meta">
                <span>${m.league}</span>
                <span>${m.time}</span>
              </div>
              <div class="match-teams">
                <span>${m.home} vs ${m.away}</span>
                <span style="color:var(--accent-green)">${m.score}</span>
              </div>
              <div class="odds-row">
                ${Object.entries(m.odds).map(([type, val]) => `
                  <div class="odd-box" onclick="addPick('${m.id}', '${matchTitle}', '${type}', ${val})">
                    <span class="odd-label">${type}</span>
                    <span class="odd-val">${val}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = "<p style='color:var(--accent-red)'>Error loading live matches.</p>";
      }
    }

    function addPick(id, match, type, odds) {
      selectedPicks = selectedPicks.filter(p => p.id !== id);
      selectedPicks.push({ id, match, type, odds });
      renderSlip();
    }

    function removePick(id) {
      selectedPicks = selectedPicks.filter(p => p.id !== id);
      renderSlip();
    }

    function renderSlip() {
      const list = document.getElementById('slip-list');
      if (!selectedPicks.length) {
        list.innerHTML = "<p style='color:var(--text-dim); font-size:12px;'>No selections added yet.</p>";
        updatePayout();
        return;
      }
      list.innerHTML = selectedPicks.map(p => `
        <div class="slip-item">
          <span class="slip-item-remove" onclick="removePick('${p.id}')">×</span>
          <div class="slip-item-title">${p.match}</div>
          <div class="slip-item-pick">Pick: ${p.type} @ ${p.odds}</div>
        </div>
      `).join('');
      updatePayout();
    }

    function updatePayout() {
      const stake = parseFloat(document.getElementById('stake-amount').value) || 0;
      const totalOdds = selectedPicks.reduce((acc, p) => acc * parseFloat(p.odds), 1);
      document.getElementById('est-payout').innerText = (selectedPicks.length ? (stake * totalOdds).toFixed(2) : "0.00") + " ETB";
    }

    function placeBet() {
      if (!selectedPicks.length) return alert('Select at least one bet option!');
      alert('Bet placed successfully!');
      selectedPicks = [];
      renderSlip();
    }

    // Keno Builder
    function initKeno() {
      const grid = document.getElementById('keno-grid');
      let html = '';
      for (let i = 1; i <= 80; i++) {
        html += `<div class="keno-btn" onclick="this.classList.toggle('selected')">${i}</div>`;
      }
      grid.innerHTML = html;
    }

    function startKenoDraw() {
      const btns = document.querySelectorAll('.keno-btn');
      btns.forEach(b => b.classList.remove('drawn'));
      let drawn = 0;
      const timer = setInterval(() => {
        const rand = Math.floor(Math.random() * 80);
        btns[rand].classList.add('drawn');
        drawn++;
        if (drawn >= 20) clearInterval(timer);
      }, 100);
    }

    // Aviator Loop
    let flightMult = 1.00;
    setInterval(() => {
      flightMult += 0.03;
      if (flightMult > 6.0) flightMult = 1.00;
      document.getElementById('flight-mult').innerText = flightMult.toFixed(2) + 'x';
    }, 200);

    function cashoutAviator() {
      alert(`Cashed out at ${flightMult.toFixed(2)}x!`);
    }

    // Initialize
    loadSportsData();
    initKeno();
  </script>
</body>
</html>
