<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lion Bingo Game</title>
  <link rel="stylesheet" href="style.css">
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎰 Lion Bingo</h1>
      <p id="user-name">እንኳን ደህና መጡ!</p>
    </header>

    <div class="card-section">
      <h3>የእርስዎ የቢንጎ ካርድ</h3>
      <div id="bingo-card" class="grid"></div>
    </div>

    <div class="action-section">
      <button id="claim-btn" onclick="claimBingo()">🎉 BINGO!</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
