<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MPL Bet - Premium Sportsbook</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
    <!-- ከፍተኛ አሞሌ -->
    <header class="header">
        <div class="header-left">
            <h1 class="logo">MPL bet</h1>
            <span class="sport-badge">Sportsbook</span>
        </div>
        <div class="header-right">
            <span class="balance"><i class="fas fa-wallet"></i> <span id="balanceDisplay">1,000.00</span> ETB</span>
            <button class="btn-login"><i class="fas fa-user"></i> Login</button>
        </div>
    </header>

    <!-- ዋና ይዘት -->
    <main class="main-container">
        <!-- ግራ ወገን - ጨዋታዎች -->
        <section class="matches-section">
            <div class="section-header">
                <h2><i class="fas fa-futbol"></i> Live & Upcoming Matches</h2>
                <select id="leagueFilter" class="filter-select">
                    <option value="all">All Leagues</option>
                    <option value="epl">English Premier League</option>
                    <option value="laliga">La Liga</option>
                    <option value="bundesliga">Bundesliga</option>
                    <option value="seriea">Serie A</option>
                </select>
            </div>
            <div id="matchesContainer" class="matches-grid">
                <!-- ጨዋታዎች በJavaScript ይታያሉ -->
            </div>
        </section>

        <!-- ቀኝ ወገን - የውርርድ ወረቀት -->
        <aside class="bet-slip-section">
            <div class="bet-slip-header">
                <h3><i class="fas fa-receipt"></i> Bet Slip</h3>
                <button id="clearSlipBtn" class="btn-clear"><i class="fas fa-trash"></i></button>
            </div>
            <div id="betSlipContainer" class="bet-slip-content">
                <p class="empty-message">No selections added yet.</p>
            </div>
            <div class="bet-slip-footer">
                <div class="odds-display">
                    <span class="total-odds-label">Total Odds</span>
                    <span id="totalOddsDisplay" class="total-odds-value">0.00x</span>
                </div>
                <div class="stake-input">
                    <label for="stakeAmount">Stake (ETB)</label>
                    <input type="number" id="stakeAmount" value="100" min="1" />
                </div>
                <div class="payout-display">
                    <span>Est. Payout</span>
                    <span id="payoutDisplay" class="payout-value">0.00 ETB</span>
                </div>
                <div class="bet-actions">
                    <button id="placeBetBtn" class="btn-place-bet"><i class="fas fa-check"></i> PLACE BET NOW</button>
                    <button id="cashoutBtn" class="btn-cashout"><i class="fas fa-money-bill-wave"></i> CASHOUT</button>
                </div>
            </div>
        </aside>
    </main>

    <!-- ማሳወቂያ -->
    <div id="notificationContainer" class="notification-container"></div>

    <script src="db.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
